<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Lushi Tab</title>
<style>
/* ===== Lushi Tab — style Windows 11 (Fluent) ===== */
:root{--ac:#ff8a1f;--act:#111;--bg:#0f1317;--pan:#202020;--pan2:#2b2b2b;--card:rgba(255,255,255,.055);--ln:rgba(255,255,255,.09);--tx:#f2f2f2;--mu:#a6a6a6;--ok:#3ccf7a;--bad:#ff5b5b;--fs:14px;--tb:48px;--fly:rgba(36,36,36,.86);--blur:blur(28px) saturate(1.6);--hov:rgba(255,255,255,.07);--r:8px}
:root.light{--pan:#f3f3f3;--pan2:#ebebeb;--card:#fff;--ln:rgba(0,0,0,.09);--tx:#1b1b1b;--mu:#5f5f5f;--fly:rgba(243,243,243,.88);--hov:rgba(0,0,0,.05)}
:root.notransp{--fly:var(--pan);--blur:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:var(--fs) "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html.mouse,html.mouse *{cursor:none!important}
input,textarea,select,button{font:inherit;color:inherit}
textarea,input[type=text],input[type=number],input[type=search],input:not([type]){user-select:text;-webkit-user-select:text}
button{cursor:pointer}
/* bureau */
#desk{position:fixed;inset:0 0 var(--tb) 0;background:var(--wall);background-size:cover;overflow:hidden}
#icons{position:absolute;left:6px;top:6px;bottom:6px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px}
.di{width:84px;padding:6px 2px;border-radius:6px;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);border:1px solid transparent}
.di:hover{background:rgba(255,255,255,.12)}.di.sel{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0 auto 4px;border-radius:10px;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.di span{font-size:12px;display:block;line-height:1.2}
#clockw{position:absolute;right:26px;top:20px;text-align:right;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
html.noclock #clockw{display:none}
#clockw .t{font-size:58px;font-weight:300;letter-spacing:-1px}#clockw .d{font-size:16px;opacity:.9}#clockw .w{font-size:13px;opacity:.85;margin-top:4px}
#snap{position:absolute;background:color-mix(in srgb,var(--ac) 22%,rgba(255,255,255,.15));border:1px solid rgba(255,255,255,.55);border-radius:8px;display:none;pointer-events:none;z-index:8999;backdrop-filter:blur(6px);transition:all .12s}
/* barre des tâches */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:var(--fly);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--ln);display:flex;align-items:center;padding:0 6px;z-index:9000;color:var(--tx)}
#bL,#bR{flex:1 1 0;display:flex;align-items:center;gap:2px;min-width:0}
#bR{justify-content:flex-end}
#bC{flex:none;display:flex;align-items:center;gap:3px;max-width:70vw;overflow:hidden}
#bApps{display:flex;gap:3px;overflow:hidden}
html.tbleft #bC{order:-1}html.tbleft #bL{order:1;flex:none}html.tbleft #bR{order:2}
.tbi{position:relative;height:40px;min-width:40px;border:0;border-radius:4px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px;color:var(--tx);padding:0 6px;transition:background .1s}
.tbi:hover,.tbi.open{background:var(--hov)}
.tbi:active>span{transform:scale(.88)}
.tbi .ti2{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px}
.tbi.run::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:3px;background:var(--mu);transition:all .15s}
.tbi.run.on{background:var(--hov)}.tbi.run.on::after{width:16px;margin-left:-8px;background:var(--ac)}
#bW{font-size:13px;gap:6px;padding:0 10px}#bW b{font-weight:600}
.logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:var(--act);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;font-family:system-ui}
.tray{height:40px;border:0;border-radius:4px;background:transparent;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--tx);font-size:12px}
.tray:hover,.tray.open{background:var(--hov)}
#bKb{font-weight:700}
#tclock{flex-direction:column;align-items:flex-end;justify-content:center;gap:0;line-height:1.25;position:relative;min-width:72px}
#nbadge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:var(--act);font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
#nbadge.on{display:flex}
#bShow{width:8px;height:40px;border:0;border-left:1px solid var(--ln);background:transparent;margin-left:4px}
#bShow:hover{background:var(--hov)}
/* panneaux (démarrer, widgets, réglages rapides…) */
.panel{position:fixed;z-index:9500;background:var(--fly);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.45);color:var(--tx);display:none;flex-direction:column;overflow:hidden}
.panel.on{display:flex;animation:pup .18s cubic-bezier(.1,.9,.2,1)}
@keyframes pup{from{opacity:0;transform:translateY(24px)}}
#start{left:50%;bottom:calc(var(--tb) + 12px);width:min(640px,calc(100vw - 16px));height:min(680px,calc(100vh - var(--tb) - 24px));margin-left:calc(min(640px,calc(100vw - 16px)) / -2)}
html.tbleft #start{left:12px;margin-left:0}
#start .shead{padding:22px 28px 10px}
#sq{width:100%;background:var(--card);border:1px solid var(--ln);border-bottom:2px solid var(--ac);border-radius:20px;padding:9px 16px 9px 38px;color:var(--tx);outline:0;background-image:radial-gradient(circle at 18px 50%,transparent 0,transparent 0)}
.sqw{position:relative}.sqw::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.8}
#sbody{flex:1;overflow:auto;padding:4px 20px 12px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:10px 8px 8px;font-weight:600;font-size:14px}
.sh button{border:0;background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:3px 10px;font-size:12px;color:var(--tx)}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
@media (max-width:620px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.sm{border-radius:4px;padding:10px 2px 8px;text-align:center;font-size:12px;border:1px solid transparent;background:none;color:var(--tx);line-height:1.2}
.sm .ic{width:36px;height:36px;font-size:20px;border-radius:9px;margin-bottom:6px}
.sm:hover,.sm.kb,.srow:hover,.srow.kb{background:var(--hov)}
.srec{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.srow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:4px;border:0;background:none;color:var(--tx);text-align:left;width:100%;min-width:0}
.srow .ic{width:32px;height:32px;font-size:17px;margin:0;border-radius:8px;flex:none}
.srow b{font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srow small{color:var(--mu);font-size:11.5px}
.srow>div{min-width:0}
.sletter{margin:10px 10px 2px;font-size:12px;color:var(--ac);font-weight:700}
.sbot{display:flex;align-items:center;justify-content:space-between;padding:10px 40px;border-top:1px solid var(--ln);background:rgba(0,0,0,.08)}
#sUser,#sPow{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:4px;padding:6px 10px;color:var(--tx)}
#sUser:hover,#sPow:hover{background:var(--hov)}#sPow{font-size:18px}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--act);display:flex;align-items:center;justify-content:center;font-weight:800}
#widgets{left:12px;top:12px;bottom:calc(var(--tb) + 12px);width:min(460px,calc(100vw - 24px));padding:16px;overflow:auto;display:none}
#widgets.on{display:block;animation:pleft .2s cubic-bezier(.1,.9,.2,1)}
@keyframes pleft{from{opacity:0;transform:translateX(-30px)}}
.wtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.wtop .t{font-size:22px;font-weight:600}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wc2{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px;min-height:110px}
.wc2.big{grid-column:1/-1}
.wc2 h5{font-size:12px;color:var(--mu);font-weight:600;margin-bottom:6px}
.wc2 .v{font-size:30px;font-weight:300}
#qs{right:12px;bottom:calc(var(--tb) + 12px);width:min(370px,calc(100vw - 24px))}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 18px 8px}
.qt{display:flex;flex-direction:column;gap:6px;align-items:center;border:0;background:none;color:var(--tx);font-size:12px}
.qt span{width:100%;height:48px;border-radius:6px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:19px}
.qt.on span{background:var(--ac);border-color:var(--ac);color:var(--act)}
.qsl{display:flex;align-items:center;gap:12px;padding:10px 22px}
.qsl input{flex:1;accent-color:var(--ac)}
.qfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--ln);background:rgba(0,0,0,.08);font-size:13px}
.qfoot button{border:0;background:none;color:var(--tx);border-radius:4px;padding:6px 10px;font-size:16px}.qfoot button:hover{background:var(--hov)}
#nc{right:12px;bottom:calc(var(--tb) + 12px);width:min(370px,calc(100vw - 24px));max-height:calc(100vh - var(--tb) - 24px);background:transparent;border:0;box-shadow:none;gap:10px;backdrop-filter:none;overflow:visible}
#nc .card{background:var(--fly);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.4);padding:14px}
#nc .nl{max-height:min(320px,40vh);overflow:auto;display:flex;flex-direction:column;gap:6px}
.nitem{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.nitem small{color:var(--mu);display:block;font-size:11px}.nitem div{flex:1}.nitem button{border:0;background:none;color:var(--mu);font-size:13px}
#tv{inset:0 0 var(--tb) 0;border-radius:0;border:0;background:rgba(0,0,0,.35);padding:30px 20px 16px}
#tv.on{display:flex}
.tvw{flex:1;display:flex;flex-wrap:wrap;gap:18px;align-content:center;justify-content:center;overflow:auto}
.tvc{width:230px;border-radius:8px;background:var(--fly);border:2px solid transparent;overflow:hidden;color:var(--tx);box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:left}
.tvc:hover{border-color:var(--ac)}
.tvc .h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;font-size:12.5px}.tvc .h b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvc .h button{border:0;background:none;color:var(--tx);border-radius:4px;width:26px;height:24px}.tvc .h button:hover{background:#c42b1c;color:#fff}
.tvc .p{height:120px;background:var(--wall);background-size:cover;display:flex;align-items:center;justify-content:center;font-size:44px}
.tvd{display:flex;gap:12px;justify-content:center;padding-top:14px;flex-wrap:wrap}
.tvd button{min-width:150px;height:84px;border-radius:8px;border:2px solid transparent;background:var(--wall);background-size:cover;color:#fff;font-weight:600;text-shadow:0 1px 3px #000;position:relative}
.tvd button.on{border-color:var(--ac)}.tvd button.add{background:var(--fly);color:var(--tx);text-shadow:none;font-size:13px}
.tvd button i{position:absolute;top:4px;right:6px;font-style:normal;font-size:12px;opacity:.85}
#clip{left:50%;bottom:calc(var(--tb) + 12px);width:min(380px,calc(100vw - 24px));margin-left:calc(min(380px,calc(100vw - 24px)) / -2);max-height:60vh;padding:12px}
.cl{overflow:auto;display:flex;flex-direction:column;gap:6px}
.cli{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:10px;text-align:left;color:var(--tx);font-size:13px;white-space:pre-wrap;max-height:90px;overflow:hidden}
.cli:hover{border-color:var(--ac)}
#at{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9900;background:var(--fly);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:var(--r);padding:16px;display:none;gap:12px;max-width:94vw;flex-wrap:wrap;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#at.on{display:flex}
#at .tvc{width:170px}#at .tvc .p{height:90px;font-size:34px}#at .tvc.sel{border-color:var(--ac)}
#sf{padding:10px;flex-direction:row;gap:10px;z-index:9600}
#sf.on{display:flex;animation:none}
.sfl{position:relative;width:86px;height:56px}
.sfl button{position:absolute;border:1px solid var(--ln);background:var(--card);border-radius:4px;padding:0}
.sfl button:hover{background:var(--ac);border-color:var(--ac)}
#sa{position:fixed;z-index:9400;display:none;border-radius:8px;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3);padding:14px;overflow:auto;flex-wrap:wrap;gap:12px;align-content:flex-start;justify-content:center}
#sa.on{display:flex}#sa p{width:100%;text-align:center;color:#fff;text-shadow:0 1px 3px #000;font-size:13px}
#sa .tvc{width:170px}#sa .tvc .p{height:80px;font-size:30px}
/* fenêtres */
.win{position:absolute;min-width:260px;min-height:170px;background:var(--pan);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:wopen .16s cubic-bezier(.1,.9,.2,1)}
@keyframes wopen{from{opacity:0;transform:scale(.95)}}
.win.closing{transition:opacity .12s,transform .12s;opacity:0;transform:scale(.95)}
.win.act{box-shadow:0 18px 50px rgba(0,0,0,.5);border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.win.hid,.win.od{display:none}
.wt{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding-left:12px;background:var(--pan2);touch-action:none}
.win:not(.act) .wt{opacity:.75}
.wt .ti{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt>button{width:34px;height:28px;border:0;border-radius:4px;background:none;font-size:14px;color:var(--tx)}
.wt>button:hover{background:var(--hov)}
.wcs{display:flex;align-self:stretch}
.wc{width:46px;border:0;background:none;color:var(--tx);font-size:13px}
.wc:hover{background:var(--hov)}.wc.x:hover{background:#c42b1c;color:#fff}
.wb{flex:1;overflow:auto;padding:12px;user-select:text;-webkit-user-select:text}
.wr{position:absolute;right:0;bottom:0;width:18px;height:18px;touch-action:none}
/* menu contextuel */
#ctx{position:fixed;z-index:9800;background:var(--fly);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:var(--r);padding:4px;min-width:220px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.4);color:var(--tx)}
#ctx button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:4px;padding:8px 12px;color:var(--tx);font-size:13px}#ctx button:hover{background:var(--hov)}#ctx hr{border:0;border-top:1px solid var(--ln);margin:4px}
#cur{position:fixed;left:0;top:0;z-index:99999;pointer-events:none;display:none;will-change:transform}
html.mouse #cur{display:block}
/* contrôles communs des applis */
.btn{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:6px 12px;color:var(--tx)}.btn.p{background:var(--ac);border-color:var(--ac);color:var(--act);font-weight:600}.btn.d{color:var(--bad)}
.btn:hover{filter:brightness(1.1)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.inp{background:var(--card);border:1px solid var(--ln);border-bottom-color:var(--mu);border-radius:4px;padding:6px 10px;color:var(--tx);min-width:0}
.inp:focus{outline:0;border-bottom:2px solid var(--ac)}
.note{font-size:12px;color:var(--mu);line-height:1.45}
h4{margin:12px 0 6px;font-size:13.5px;font-weight:600}
table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:13px}th{color:var(--mu);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.calc button{height:50px;border-radius:4px;border:1px solid var(--ln);background:var(--card);font-size:19px;color:var(--tx)}.calc .o{background:var(--pan2)}.calc .eq{background:var(--ac);color:var(--act);font-weight:700}
.cdisp{padding:8px 12px;text-align:right;margin-bottom:8px}.cdisp .h{color:var(--mu);font-size:12px;min-height:16px}.cdisp .v{font-size:36px;font-weight:600;word-break:break-all}
.nlist{width:190px;flex:none;border-right:1px solid var(--ln);overflow:auto}.nlist div{padding:8px 12px;border-bottom:1px solid var(--ln);font-size:13px}.nlist div.on{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.ned{flex:1;display:flex;flex-direction:column;min-width:0}.ned textarea{flex:1;resize:none;border:0;outline:0;background:var(--card);padding:12px;line-height:1.5;font-size:15px}
.accbar{display:flex;gap:3px;flex-wrap:wrap;padding:4px 6px;border-top:1px solid var(--ln);background:var(--pan2)}.accbar button{min-width:30px;height:28px;border-radius:4px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.osk{display:flex;flex-direction:column;gap:5px}.osk .r{display:flex;gap:5px;justify-content:center}.osk button{flex:1;min-width:0;height:46px;border-radius:5px;border:1px solid var(--ln);background:var(--card);font-size:17px;color:var(--tx)}.osk button.w2{flex:1.6}.osk button.sp{flex:6}.osk button.on{background:var(--ac);color:var(--act)}
.kbd{display:inline-block;border:1px solid var(--ln);border-bottom-width:3px;border-radius:5px;padding:1px 6px;font-size:12px;background:var(--card);margin:1px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:5px;overflow:hidden;flex-wrap:wrap}.seg button{border:0;background:var(--card);padding:7px 12px;color:var(--tx)}.seg button.on{background:var(--ac);color:var(--act);font-weight:600}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.walls button{height:56px;border-radius:6px;border:2px solid transparent}.walls button.on{border-color:var(--ac)}
.accs{display:flex;gap:8px;flex-wrap:wrap}.accs button{width:34px;height:34px;border-radius:6px;border:2px solid transparent}.accs button.on{border-color:var(--tx)}
iframe{border:0;width:100%;height:100%;background:#fff}
.lock{position:fixed;inset:0;z-index:99990;background:var(--wall);background-size:cover;display:none;flex-direction:column;align-items:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);padding-top:12vh}.lock.on{display:flex}.lock .d{font-size:20px;font-weight:600}.lock .t{font-size:96px;font-weight:600;line-height:1.1}.lock .h{margin-top:auto;margin-bottom:8vh;opacity:.85;font-size:14px}
#toast{position:fixed;right:14px;bottom:calc(var(--tb) + 14px);background:var(--fly);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--tx);border:1px solid var(--ln);border-radius:var(--r);padding:12px 16px;font-size:13px;z-index:99000;display:none;max-width:min(360px,90vw);box-shadow:0 12px 34px rgba(0,0,0,.4);animation:tin .2s ease-out}
#toast small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal div{padding:6px 0;border-radius:50%;font-size:13px}.cal .h{color:var(--mu);font-size:11px}.cal .td{background:var(--ac);color:var(--act);font-weight:700}

<script type="text/plain" id="apk-main">
package com.lushipratique.lushitab;

import android.os.Build;
import android.os.Bundle;
import android.view.WindowManager;
import androidx.core.view.WindowCompat;
import androidx.core.view.WindowInsetsCompat;
import androidx.core.view.WindowInsetsControllerCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        registerPlugin(LushiNativePlugin.class);
        super.onCreate(savedInstanceState);
        if (Build.VERSION.SDK_INT >= 28) {
            getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
        }
        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
        toutCacher();
    }

    @Override
    public void onResume() {
        super.onResume();
        toutCacher();
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) toutCacher();
    }

    // Cache la barre du haut ET les 3 boutons d'Android : Lushi Tab occupe tout l'écran.
    // Un glissement depuis le bord les fait réapparaître un instant.
    private void toutCacher() {
        WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
        c.hide(WindowInsetsCompat.Type.systemBars());
        c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
    }

    // Le bouton Retour ne quitte pas Lushi Tab : il ferme le menu ou la fenêtre du dessus.
    @Override
    @SuppressWarnings("deprecation")
    public void onBackPressed() {
        if (getBridge() != null) getBridge().triggerWindowJSEvent("lushiback");
    }
}
</script>
<script type="text/plain" id="apk-plugin">
package com.lushipratique.lushitab;

import android.app.ActivityManager;
import android.app.ActivityOptions;
import android.graphics.Rect;
import android.util.DisplayMetrics;
import android.content.Context;
import android.content.Intent;
import android.net.Uri;
import android.provider.Settings;
import androidx.core.view.WindowCompat;
import androidx.core.view.WindowInsetsCompat;
import androidx.core.view.WindowInsetsControllerCompat;
import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;

@CapacitorPlugin(name = "LushiNative")
public class LushiNativePlugin extends Plugin {
    private boolean epingle() {
        ActivityManager am = (ActivityManager) getContext().getSystemService(Context.ACTIVITY_SERVICE);
        return am != null && am.getLockTaskModeState() != ActivityManager.LOCK_TASK_MODE_NONE;
    }

    private void liberer() {
        getActivity().runOnUiThread(() -> { try { if (epingle()) getActivity().stopLockTask(); } catch (Exception e) { } });
        try { Thread.sleep(250); } catch (Exception e) { }
    }

    // Verrouille Lushi Tab : Accueil et Applis récentes ne font plus sortir.
    @PluginMethod
    public void pin(PluginCall call) {
        getActivity().runOnUiThread(() -> { try { if (!epingle()) getActivity().startLockTask(); } catch (Exception e) { } });
        call.resolve();
    }

    @PluginMethod
    public void unpin(PluginCall call) { liberer(); call.resolve(); }

    // Démarrer > Éteindre : on rend la main à Android.
    @PluginMethod
    public void quit(PluginCall call) {
        liberer();
        getActivity().runOnUiThread(() -> {
            WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getActivity().getWindow(), getActivity().getWindow().getDecorView());
            c.show(WindowInsetsCompat.Type.systemBars());
            getActivity().moveTaskToBack(true);
        });
        call.resolve();
    }

    @PluginMethod
    public void homeSettings(PluginCall call) {
        liberer();
        try {
            Intent i = new Intent(Settings.ACTION_HOME_SETTINGS);
            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            getContext().startActivity(i);
        } catch (Exception e) {
            Intent i = new Intent(Settings.ACTION_SETTINGS);
            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            getContext().startActivity(i);
        }
        call.resolve();
    }

    // Ouvrir une appli Android (WhatsApp…) : en fenêtre flottante si la tablette le permet.
    // On libère le verrou un instant ; Lushi Tab se reverrouille quand on y revient.
    private static int cascade = 0;

    @PluginMethod
    public void openApp(PluginCall call) {
        JSObject r = new JSObject();
        try {
            Intent i = getContext().getPackageManager().getLaunchIntentForPackage(call.getString("pkg", ""));
            if (i == null) { r.put("ok", false); call.resolve(r); return; }
            liberer();
            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            if (call.getBoolean("fenetre", true)) {
                DisplayMetrics dm = getContext().getResources().getDisplayMetrics();
                int w = (int) (dm.widthPixels * 0.55), hh = (int) (dm.heightPixels * 0.70);
                int pas = (int) (40 * dm.density), dx = (cascade % 6) * pas;
                cascade++;
                int l = (dm.widthPixels - w) / 2 - 2 * pas + dx, t = (int) (dm.heightPixels * 0.08) + dx / 2;
                ActivityOptions o = ActivityOptions.makeBasic();
                o.setLaunchBounds(new Rect(l, t, l + w, t + hh));
                try { ActivityOptions.class.getMethod("setLaunchWindowingMode", int.class).invoke(o, 5); } catch (Exception e) { }
                getContext().startActivity(i, o.toBundle());
            } else {
                getContext().startActivity(i);
            }
            r.put("ok", true); call.resolve(r);
        } catch (Exception e) { r.put("ok", false); call.resolve(r); }
    }

    @PluginMethod
    public void openUrl(PluginCall call) {
        try {
            liberer();
            Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(call.getString("url", "")));
            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            getContext().startActivity(i);
            call.resolve();
        } catch (Exception e) { call.reject("Impossible d'ouvrir le lien"); }
    }
}
